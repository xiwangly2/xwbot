name: Cleanup GHCR

on:
  push:
    branches:
      - 'main'
      - 'dev'
    tags:
      - 'v*'
  # schedule:
  #   - cron: '0 3 * * 0'   # 每周日凌晨
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Delete untagged images
        uses: actions/delete-package-versions@v5
        with:
          package-name: xwbot
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 30
