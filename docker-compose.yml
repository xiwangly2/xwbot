# 下面是示例的 docker-compose.yml 文件，你应该根据自己的需求进行修改
services:
  xwbot:
    image: ghcr.io/xiwangly2/xwbot:main # 使用 ghcr 镜像，或者替换为你的镜像名称
    container_name: xwbot
    restart: always
    network_mode: bridge
    volumes:
      - ./config:/app/config
    stdin_open: true
    tty: true
    # 环境变量可以在此处添加，根据需要自行配置

#  go-cqhttp:
#    image: mrs4s/cqhttp:latest # 使用 go-cqhttp 镜像
#    container_name: go-cqhttp
#    restart: always
#    volumes:
#      - ./go-cqhttp:/data
#    ports:
#      - "9000:9000" # 请根据需要配置端口
#
#  mysql:
#    image: mysql:latest
#    container_name: mysql
#    restart: always
#    environment:
#      MYSQL_ROOT_PASSWORD: your_root_password # 替换为您的MySQL root密码
#      MYSQL_DATABASE: xwbot_db # 替换为您的数据库名称
#      MYSQL_USER: xwbot_user # 替换为您的数据库用户名
#      MYSQL_PASSWORD: your_db_password # 替换为您的数据库密码
#    volumes:
#      - ./mysql/data:/var/lib/mysql
#    ports:
#      - "3306:3306" # 如果需要从主机访问MySQL，请根据需要配置端口

  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: xwbot_user # 替换为您的数据库用户名
      POSTGRES_PASSWORD: your_db_password # 替换为您的数据库密码
      POSTGRES_DB: xwbot_db # 替换为您的数据库名称
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # 如果需要从主机访问PostgreSQL，请根据需要配置端口

  napcat:
    # 参考 WebsockServer Compose模板 https://github.com/NapNeko/NapCat-Docker/blob/main/compose/ws.yml
    # 记得修改 Webui 密码还有添加 WS 服务器配置，String类型，token 设置一下
    # NAPCAT_UID=$(id -u) NAPCAT_GID=$(id -g) docker-compose up -d
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always
    network_mode: bridge
    mac_address: 02:42:ac:11:00:02  # 添加MAC地址固化配置

    environment:
      - NAPCAT_UID=${NAPCAT_UID}
      - NAPCAT_GID=${NAPCAT_GID}

    ports:
      - "3001:3001"
      - "6099:6099"

    volumes:
      - ./napcat/config:/app/napcat/config
      - ./ntqq:/app/.config/QQ

networks:
  host:
    external: true
